[project]
name = "todo-app-backend"
version = "0.1.0"
description = "FastAPI backend for Todo Web Application"
authors = [{name = "Team", email = "team@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlmodel>=0.0.11",
    "pydantic>=2.4.2",
    "better-auth>=0.0.1b11",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "python-jose>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.6",
    "email-validator>=2.1.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch]
build.targets.wheel.packages = ["src"]
build.targets.wheel.shared-data = { "frontend/dist" = "frontend/dist" }

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true
show-fixes = true
output-format = "full"

[tool.ruff.lint]
extend-select = [
    "ALL",  # Enable all rule codes by default
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files

[tool.ruff.lint.isort]
known-first-party = ["src"]
required-imports = ["from __future__ import annotations"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"