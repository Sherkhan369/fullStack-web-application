[project]
name = "todo-cli-app"
version = "1.0.0"
description = "A Python console-based Todo application (Phase I)"
requires-python = ">=3.13"
readme = "README.md"
authors = [
    { name = "Todo CLI Team" }
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
